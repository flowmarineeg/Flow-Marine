services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistics_backend_dev
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:5003:5000"
    volumes:
      - uploads_data:/app/src/uploads/expenses
    networks:
      - logistics_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: logistics_frontend_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - logistics_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads_data:
    driver: local

networks:
  logistics_net:
    driver: bridge